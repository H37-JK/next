[project]
name = "backend"
version = "0.1.0"
description = "고객 불만 메일 자동 처리 예제 (LangGraph + Claude Agent SDK + LangChain + LangSmith)"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.168",
    "langgraph>=1.2",
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "langsmith>=0.14",
    "pydantic>=2",
    "psycopg[binary,pool]>=3.2",
    "fastembed>=0.7",
    "pgvector>=0.4",
    "fastapi>=0.148.0",
    "uvicorn[standard]>=0.54.0",
    "langgraph-checkpoint-postgres>=3.2.0",
]
